[package]
name = "dify-console"
version = "0.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
rpassword = "7.3"
base64 = "0.22.1"
walkdir = "2.5"
url = "2.5"
regex = "1.10"
